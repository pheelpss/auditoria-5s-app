name: auditoria_5s
description: Aplicativo de auditoria 5S para uso industrial em campo.
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  archive: ^3.4.10
  image: ^4.1.7
  xml: ^6.5.0
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  uuid: ^4.3.3
  open_filex: ^4.4.0
  share_plus: ^10.0.0
  receive_sharing_intent: 1.8.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.1
  video_player_platform_interface: ^6.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/ondexa-logo.png
    - assets/branding/ondexa-opening-portrait.png
    - assets/branding/ondexa-opening.mp4
    - assets/branding/ondexa-icon.png
    - assets/branding/ondexa-icon-foreground.png
    - assets/branding/ondexa-splash-android12.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/ondexa-icon.png
  adaptive_icon_background: '#030711'
  adaptive_icon_foreground: assets/branding/ondexa-icon-foreground.png
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: '#030711'
  color_dark: '#030711'
  image: assets/branding/ondexa-opening-portrait.png
  image_dark: assets/branding/ondexa-opening-portrait.png
  android_gravity: fill
  android_12:
    color: '#030711'
    color_dark: '#030711'
    image: assets/branding/ondexa-splash-android12.png
    image_dark: assets/branding/ondexa-splash-android12.png

