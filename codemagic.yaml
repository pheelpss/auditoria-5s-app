workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Gerar pasta Android (sem sobrescrever o código)
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name auditoria_5s --org com.suaempresa temp_scaffold
            cp -R temp_scaffold/android .
            rm -rf temp_scaffold
          fi
      - name: Adicionar permissões (câmera, fotos, arquivos)
        script: |
          perl -0777 -pi -e 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Configurar Compartilhamento e Deep Link (.5s)
        script: |
          cat << 'EOF' > intent_filter.xml
              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="application/*" />
                  <data android:mimeType="*/*" />
              </intent-filter>
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="content" />
                  <data android:scheme="file" />
                  <data android:host="*" />
                  <data android:pathPattern=".*\.5s" />
              </intent-filter>
          </activity>
          EOF
          perl -0777 -pi -e 's#</activity>#`cat intent_filter.xml`#e' android/app/src/main/AndroidManifest.xml
      - name: Ajustar compileSdk para 36
        script: |
          perl -pi -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Alinhar Compatibilidade JVM para Java 11 (.kts)
        script: |
          echo '
          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile::class.java).configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
                  }
              }
          }
          ' >> android/build.gradle.kts
      - name: Instalar dependencias e aplicar correcoes nos plugins
        script: |
          flutter pub get
          
          # 1. Conserta o erro do JCenter
          find ~/.pub-cache/hosted -name "build.gradle" -type f -exec perl -pi -e 's/jcenter\(\)/mavenCentral\(\)/g' {} +
          
          # 2. Conserta o erro do Namespace ausente
          find ~/.pub-cache/hosted -type f -name "build.gradle" | grep "receive_sharing_intent" | xargs perl -pi -e 's/android \{/android {\n    namespace "com.kasem.receive_sharing_intent"/g'
      - name: Compilar APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
