workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Gerar pasta Android (sem sobrescrever o código)
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name auditoria_5s --org com.suaempresa temp_scaffold
            cp -R temp_scaffold/android .
            rm -rf temp_scaffold
          fi
      - name: Adicionar permissões (câmera, fotos, arquivos)
        script: |
          perl -0777 -pi -e 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Ajustar compileSdk para 36
        script: |
          perl -pi -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Registrar app para abrir arquivos .5s
        script: |
          perl -0777 -pi -e 's#</activity>#<intent-filter>\n          <action android:name="android.intent.action.VIEW" />\n          <category android:name="android.intent.category.DEFAULT" />\n          <data android:mimeType="*/*" android:scheme="content" />\n        </intent-filter>\n        <intent-filter>\n          <action android:name="android.intent.action.SEND" />\n          <category android:name="android.intent.category.DEFAULT" />\n          <data android:mimeType="*/*" />\n        </intent-filter>\n      </activity>#' android/app/src/main/AndroidManifest.xml
          perl -pi -e 's/android:launchMode="singleTop"/android:launchMode="singleTask"/' android/app/src/main/AndroidManifest.xml
      - name: Corrigir JVM target entre módulos (plugins antigos)
        script: |
          cat >> android/build.gradle.kts << 'GRADLEEOF'

          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                      compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                      compileOptions.targetCompatibility = JavaVersion.VERSION_17
                  }
                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                      compilerOptions {
                          jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                      }
                  }
              }
          }
          GRADLEEOF
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Compilar APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
